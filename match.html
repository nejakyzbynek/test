<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nihongo</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/5.0.0-alpha1/css/bootstrap.min.css" integrity="sha384-r4NyP46KrjDleawBgD5tp8Y7UzmLA05oM1iAEQ17CSuDqnUK2+k9luXQOfXJCJ4I" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <title>JP–CZ Matching</title>
</head>
<body>
<nav class="navbar navbar-expand-md navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="main.html">NIHONGO</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" aria-current="page" href="main.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="match.html">Match</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="lexicon.html">Lexicon</a>
          </li>
        </ul>
    </div>
  </div>
</nav>

<div class="container">
  <div class="row">
    <div class="col">
      <h1>Spoj správná slovíčka</h1>
    </div>
  </div>
  <div class="row">
    <div class="col">
      <div id="lessonSelect">
        Lekce:
          <select onchange="changeLesson(this.value)">
            <option value="lesson6">Lesson 6</option>
            <option value="lesson7">Lesson 7</option>
            <option value="lesson8">Lesson 8</option>
            <option value="lesson9">Lesson 9</option>
            <option value="lesson10">Lesson 10</option>
            <option value="tellingtime">Telling time</option>
            <option value="hiragana">Hiragana</option>
            
          </select>
      </div>
    </div>
  </div>
  <div class="row"> 
    <div class="col">
      <div id="stepContainer">
        Step:
        <select id="stepSelect" onchange="changeStep(this.value)">
          <!-- options will be populated by script.js -->
        </select>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col">
        <div id="score">
          ✅ Správně: <span id="correctCount">0</span> |
          ❌ Špatně: <span id="wrongCount">0</span>
        </div>
    </div>
  </div>
</div>

<div class="game">
  <div class="column" id="left"></div>
  <div class="column" id="right"></div>
</div>

<button class="button_novekolo" onclick="start()">🔄 Nové kolo</button>

<button id="nextStep" style="display:none" onclick="nextStep()">
  ▶ Další část
</button>


<script src="js/script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
